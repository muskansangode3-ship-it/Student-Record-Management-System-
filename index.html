<!DOCTYPE html>
<html>
<head>
    <title>Student Record Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .form-box,
        .records {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            color: #444;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 95%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
            margin-right: 5px;
        }

        button:hover {
            background: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #aaa;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #ddd;
        }

        .delete-btn {
            background: #d9534f;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Record Management System</h1>

    <div class="form-box">

        <h2>Add Student Record</h2>

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter student name">

        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="Enter roll number">

        <label>Branch</label>
        <input type="text" id="branch" placeholder="Enter branch">

        <label>Year</label>
        <input type="text" id="year" placeholder="Enter year">

        <label>Marks</label>
        <input type="number" id="marks" placeholder="Enter marks">

        <button onclick="addStudent()">Add Student</button>

    </div>

    <div class="records">

        <h2>Student Records</h2>

        <input type="text" id="search"
               placeholder="Search by name or roll number"
               onkeyup="searchStudent()">

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Branch</th>
                    <th>Year</th>
                    <th>Marks</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

</div>

<script>

    let students = [];

    function addStudent() {

        let name = document.getElementById("name").value;
        let roll = document.getElementById("roll").value;
        let branch = document.getElementById("branch").value;
        let year = document.getElementById("year").value;
        let marks = document.getElementById("marks").value;

        if (name === "" || roll === "" || branch === "" ||
            year === "" || marks === "") {

            alert("Please enter all student details.");
            return;
        }

        let student = {
            name: name,
            roll: roll,
            branch: branch,
            year: year,
            marks: marks
        };

        students.push(student);

        displayStudents();

        document.getElementById("name").value = "";
        document.getElementById("roll").value = "";
        document.getElementById("branch").value = "";
        document.getElementById("year").value = "";
        document.getElementById("marks").value = "";
    }


    function displayStudents() {

        let table = document.getElementById("studentTable");

        table.innerHTML = "";

        for (let i = 0; i < students.length; i++) {

            let row = table.insertRow();

            row.insertCell(0).innerHTML = students[i].name;
            row.insertCell(1).innerHTML = students[i].roll;
            row.insertCell(2).innerHTML = students[i].branch;
            row.insertCell(3).innerHTML = students[i].year;
            row.insertCell(4).innerHTML = students[i].marks;

            row.insertCell(5).innerHTML =
                '<button class="delete-btn" onclick="deleteStudent('
                + i + ')">Delete</button>';
        }
    }


    function deleteStudent(index) {

        students.splice(index, 1);

        displayStudents();
    }


    function searchStudent() {

        let searchValue =
            document.getElementById("search").value.toLowerCase();

        let table =
            document.getElementById("studentTable");

        table.innerHTML = "";

        for (let i = 0; i < students.length; i++) {

            if (
                students[i].name.toLowerCase().includes(searchValue) ||
                students[i].roll.toLowerCase().includes(searchValue)
            ) {

                let row = table.insertRow();

                row.insertCell(0).innerHTML = students[i].name;
                row.insertCell(1).innerHTML = students[i].roll;
                row.insertCell(2).innerHTML = students[i].branch;
                row.insertCell(3).innerHTML = students[i].year;
                row.insertCell(4).innerHTML = students[i].marks;

                row.insertCell(5).innerHTML =
                    '<button class="delete-btn" onclick="deleteStudent('
                    + i + ')">Delete</button>';
            }
        }
    }

</script>

</body>
  </html>
